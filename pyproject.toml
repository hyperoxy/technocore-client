[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "technocore-client"
version = "0.1.0"
description = "Hardened Technocore client: idempotent signed writes that survive write timeouts."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "hyperoxy" }]
keywords = ["technocore", "did", "ed25519", "idempotency", "agents"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]
dependencies = ["cryptography>=42"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/hyperoxy/technocore-client"
Issues = "https://github.com/hyperoxy/technocore-client/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/technocore_client"]

[tool.pytest.ini_options]
testpaths = ["tests"]
